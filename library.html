<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Novel Constellation Library</title>
    <link rel="stylesheet" href="libstyles.css">
    <link rel="icon" href="assets/favicon.jpeg">
    <script src="library.js" defer></script>
</head>
<body class="library-page">
    <div id="background-img-container">
        <a href="index.html"><div id="center-star"></div></a>

        <main id="library">
            <button class="book" type="button" data-review="The journey this novel has brought me along spans far beyond anything that I have experienced ever before.
            Though the writing style itself is nothing exemplary, the worldbuilding and character development have created a universe that still feels 
            alive alongside me, and I feel like I take it with me wherever I go. ">
                <img src="assets/books/lotm.jpg"
                     alt="Lord of the Mysteries">
            </button>

            <button class="book" type="button" data-review="Beautiful character work. Despite the rushed ending, the relationship developments between our protagonist and everyone else 
            in this world is nothing short of masterful. Yes the worldbuilding is fantastic, but this story is simply at its best when exploring the pain and possibilities that come
            from the idea of constantly dissolving personal relationships.">
                <img src="assets/books/MOL.jpeg"
                     alt="Mother of Learning">
            </button>

            <button class="book" type="button" data-review="Simply the best worldbuilding that I have ever had the joy of experiencing. This novel will have you wanting to delve deep into the 
            history of this otherworld. Abilities and politics dictated by plans and grudges from centuries past.">
                <img src="assets/books/reverend-insanity.png"
                     alt="Reverend Insanity">
            </button>

            <button class="book" type="button" data-review="I read this book at the age of 9 as work coupled with it's thematic mirror, the call of the wild. Perhaps it was due to the 
            counterparts endind but this story throughout gave me an undescribable feeling of relief.">
                <img src="covers/01-white-fang.jpg"
                     alt="White Fang">
            </button>

            <button class="book" type="button" data-review="Fantastic read, this was my first introduction to a non-human protagonist and this books ability to put me in the shoes of this 
            dog will be praised till the day I die.">
                <img src="covers/44-the-call-of-the-wild.jpg"
                     alt="Call of the Wild">
            </button>

            <button class="book" type="button" data-review="A book that I can comfortably say had the intricacies and novelty fly over my head when I first read it. Definitely
            benefited from a second read where the implications of the story had a deeper impact.">
                <img src="covers/38-speaker-for-the-dead.jpg"
                     alt="Speaker for the dead">
            </button>

            <button class="book" type="button" data-review="An excellent example of an unreliable narrator, and a book that reads better on multiple reads. Massive chunks of the novel 
            simply do not occur whatsoever. ">
                <img src="covers/02-atonement.jpg"
                     alt="Atonement">
            </button>

            <button class="book" type="button" data-review="A book that gets much better when looked at through an analytical lense. Many references and deeper themes were originally lost on me 
            during a casual read were put to the forefront when the book was taken apart piece by piece.">
                <img src="covers/03-the-handmaids-tale.jpg"
                     alt="The Handmaid's Tale">
            </button>

            <button class="book" type="button" data-review="Hilarious. Can be described as a perfect holiday book.">
                <img src="covers/04-thank-you-jeeves.jpg"
                     alt="Thank You, Jeeves">
            </button>

            <button class="book" type="button" data-review="While I've never partaken, I can only imagine that being on any of the pastimes enjoyed in this book must feel as dizzying as
            reading it.">
                <img src="covers/05-fear-and-loathing-in-las-vegas.jpg"
                     alt="Fear and Loathing in Las Vegas">
            </button>

            <button class="book" type="button" data-review="Terrible though she may be, Rowling did successfully make a childrens book that breathed a love of fantasy into and entire generation,
            me included. A fascinating world full of holes and logical inconsistencies, that I can't help but enjoy.">
                <img src="covers/06-harry-potter-and-the-philosophers-stone.jpg"
                     alt="Harry Potter and the Philosopher's Stone">
            </button>

            <button class="book" type="button" data-review="The start of the first book series I read that required me to wait for next entry releases, and wait I did. Fantastic storytelling
            of what is a fairly uncomplicated premise. The creative direction will have you questioning whether Cowell had planned the story from the beginning.">
                <img src="covers/13-how-to-train-your-dragon.jpg"
                     alt="How to Train Your Dragon">
            </button>

            <button class="book" type="button" data-review="Unsettling to the extreme. Another book I feel I read too early in life and could not appreciate the darker themes that made the book so interesting.">
                <img src="covers/25-tinder.jpg"
                     alt="Tinder">
            </button>

            <button class="book" type="button" data-review="Beautiful language put to deeply uncomfortable use. The obsession with preserving an appearance while allowing everything beneath it to decay is explored with a wit that makes the cruelty even sharper.">
                <img src="covers/26-the-picture-of-dorian-gray.jpg"
                     alt="The Picture of Dorian Gray">
            </button>

            <button class="book" type="button" data-review="Diana Wynne Jones is who I believe should be the poster for childrens fantasy. Beautiful prose and storytelling, and extremely reminiscent of 
            the fear associated with the unknowingness of Heidi or The Secret Garden">
                <img src="covers/40-house-of-many-ways.jpg"
                     alt="House of Many Ways">
            </button>

            <button class="book" type="button" data-review="A very painful, very gorgeous book. A book I read far too early in life, and struggled to pick back up later. Discomfort is rampant throug
            Gaiman's fantastic prose and the juxtaposed terrifying nature of this world and the innocence of our protagonist is done beautifully">
                <img src="covers/27-the-ocean-at-the-end-of-the-lane.jpg"
                     alt="The Ocean at the End of the Lane">
            </button>

            <button class="book" type="button" data-review="Infuriating in the fact that there isn't more of it. Thrilling and endearing to my childhood brain with just enough feelgood found family themes
            throughout to keep it at number 1 as my comfort book for years.">
                <img src="covers/28-the-graveyard-book.jpg"
                     alt="The Graveyard Book">
            </button>

            <button class="book" type="button" data-review="A very surprisingly enjoyable read for me, as I didn't spend too much time with this genre before this, which this book very much changed. A 
            scary tale about the woes of life but a beautiful story to find meaning in.">
                <img src="covers/29-normal-people.jpg"
                     alt="Normal People">
            </button>

            <button class="book" type="button" data-review="Easy introduction to the concept of greed is evil, with simple language that makes the themes feel even more unnerving. I was forced to read
            this short story by my english teacher, and what I can say about it now is that I will be forcing my own children to read it.">
                <img src="covers/32-animal-farm.jpg"
                     alt="Animal Farm">
            </button>

            <button class="book" type="button" data-review="Every moment of this book feels like it must handled as though it were made of glass. The temperament of this world, especially as told 
            through the eyes of a child is painful and simply terrifying.">
                <img src="covers/33-to-kill-a-mockingbird.jpg"
                     alt="To Kill a Mockingbird">
            </button>

            <button class="book" type="button" data-review="Baby's first anti government and it does it so well. The entire series and eventual spin offs are done fantastically, with this being an 
            incredible foundation for the works to come. ">
                <img src="covers/34-the-hunger-games.jpg"
                     alt="The Hunger Games">
            </button>

            <button class="book" type="button" data-review="Extremely good on the first read, even better on the second. Not subtle in any way whatsoever about its thoughts regarding war, but sometimes
            lacking subtlety is what people need in order to stare down the barrel of a gun being held by a child soldier who barely understands what life even is.">
                <img src="covers/37-enders-game.jpg"
                     alt="Ender's Game">
            </button>

            <button class="book" type="button" data-review="Uncomfortable but brilliant. My experience with this book and this story is longer than can be said here, but our evil protagonist and his
            manipulations have shown me in more ways than one that there are truly disgusting individuals among us. ">
                <img src="covers/39-lolita.jpg"
                     alt="Lolita">
            </button>

            <button class="book" type="button" data-review="I believe my first story with a twist so natural that I barely remember it being there until I come back to it. My first introduction 
            to a soft magic system, and a brilliant system it is. Could I tell you how exactly it works? Not at all! Did my childhood mind absolutely love every single page of the book? Absolutely!">
                <img src="covers/42-charmed-life.jpg"
                     alt="Charmed Life">
            </button>
        </main>
    </div>

    <dialog id="book-dialog">
        <button id="close-dialog">×</button>
        <img id="dialog-cover" src="" alt="">
        <h2 id="book-title"></h2>
        <p id="book-review"></p>
    </dialog>
</body>
</html>
