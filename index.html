<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Novel Constellations</title>
<link rel="stylesheet" href="styles.css">
<link rel="icon" href="assets/favicon.jpeg">
<body>
    <div id="hero">
        <div id="circle">
                <span class="star" style="--angle: 0deg;">✦</span>
                <span class="star" style="--angle: 90deg;">✦</span>
                <span class="star" style="--angle: 180deg;">✦</span>
                <span class="star" style="--angle: 270deg;">✦</span>
                <div class="line" id="line1"><p>1</p></div>
                <div class="line" id="line2"><p>2</p></div>
                <div class="line" id="line3"><p>3</p></div>
                <div class="faint-line" style="--angle: 0deg;"></div>
                <div class="faint-line" style="--angle: 30deg;"></div>
                <div class="faint-line" style="--angle: 60deg;"></div>
                <div class="faint-line" style="--angle: 90deg;"></div>
                <div class="faint-line" style="--angle: 120deg;"></div>
                <div class="faint-line" style="--angle: 150deg;"></div>
                <div class="faint-line" style="--angle: 15deg;"></div>
                <div class="faint-line" style="--angle: 45deg;"></div>
                <div class="faint-line" style="--angle: 75deg;"></div>
                <div class="faint-line" style="--angle: 105deg;"></div>
                <div class="faint-line" style="--angle: 135deg;"></div>
                <div class="faint-line" style="--angle: 165deg;"></div>
        </div>
    </div>

</body>
